[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-ffmpeg"
version = "0.1.0"
description = "Production-ready, strictly typed async wrapper for FFmpeg and FFprobe"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["ffmpeg", "ffprobe", "async", "asyncio", "video", "audio", "transcode", "streaming"]
authors = [
    { name = "async-ffmpeg contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ytdlp = [
    "async-yt-dlp>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "coverage>=7.6.0",
]

[tool.uv.sources]
async-yt-dlp = { path = "../AsyncYTDLP" }


[project.urls]
Homepage = "http://localhost:3000/6aton/AsyncFFmpeg"
Documentation = "http://localhost:3000/6aton/AsyncFFmpeg#readme"
Repository = "ssh://git@localhost:2222/6aton/AsyncFFmpeg.git"
Issues = "http://localhost:3000/6aton/AsyncFFmpeg/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/async_ffmpeg"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "A005",   # Module shadowing standard library module
    "RET505", # Unnecessary elif after return
    "RUF001", # Ambiguous unicode characters in string (Cyrillic)
    "RUF002", # Ambiguous unicode characters in docstring (Cyrillic)
    "RUF003", # Ambiguous unicode characters in comment (Cyrillic)
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["async_ffmpeg"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests requiring real ffmpeg/ffprobe executable",
    "slow: marks slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
