name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint, Type Check and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Check code formatting (Ruff)
        run: |
          uv run ruff format --check src/ tests/ docs/

      - name: Lint codebase (Ruff)
        run: |
          uv run ruff check src/ tests/ docs/

      - name: Type check (Mypy)
        run: |
          uv run mypy src/

      - name: Run unit & integration tests with coverage
        run: |
          uv run coverage run -m pytest tests/ -v
          uv run coverage report -m

      - name: Build distribution packages (Wheel & Sdist)
        run: |
          uv build
